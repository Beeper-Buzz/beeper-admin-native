name: Release to npm
# Publishes every public package under packages/ whose version is not on npm yet.
# Publishes through npm trusted publishing (GitHub OIDC): each package lists this repo and
# release.yml as its trusted publisher on npmjs.com, so no npm token is stored anywhere.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check only, publish nothing
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance
concurrency: release
jobs:
  publish:
    # Forks publishing their own builds change this and the package scope.
    if: github.repository == '1instinct/spree-admin-native'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: npm 11.5.1+ for trusted publishing (pnpm publishes through the npm CLI)
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Publish
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
