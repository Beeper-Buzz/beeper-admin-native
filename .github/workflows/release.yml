name: Release to npm
# Publishes every public package under packages/ whose version is not on npm yet.
# Needs the NPM_TOKEN repository secret (npm granular token with publish rights on the @instincts scope).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check only, publish nothing
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write # npm provenance
concurrency: release
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Publish
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
